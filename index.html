<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>切替確認</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.hidden{display:none!important}.screen{min-height:100vh}.wrap{max-width:720px;margin:auto;padding:18px}
.file-no{position:fixed;top:max(8px,env(safe-area-inset-top));right:10px;z-index:9999;font-size:10px;font-weight:700;color:rgba(255,255,255,.28);letter-spacing:.5px;pointer-events:none}
h1{text-align:center;margin:8px 0 20px;font-size:30px}.card{background:#18181b;border-radius:16px;padding:16px;margin-bottom:14px}
.label{color:#aaa;font-size:14px;margin-bottom:7px}.model{font-size:32px;font-weight:900;letter-spacing:2px}
.main-btn,.retry-btn,.cancel-btn{width:100%;min-height:58px;border:0;border-radius:14px;color:#fff;font-size:18px;font-weight:900}
.main-btn,.retry-btn{background:#0a84ff}.cancel-btn{background:#2c2c2e;margin-top:10px}
.start-box{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:620px;margin:auto;padding:22px}
.start-title{text-align:center;font-size:36px;font-weight:900;margin-bottom:12px}.start-sub{text-align:center;color:#aaa;margin-bottom:28px}
.inspect-title{margin:24px 0 10px;font-size:22px;font-weight:900}
.item{display:flex;align-items:center;gap:12px;min-height:62px;padding:12px 14px;margin-bottom:10px;background:#18181b;border:1px solid #303034;border-radius:14px}
.num{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#2c2c2e;font-weight:900;flex:none}
.name{flex:1;min-width:0;font-size:18px;font-weight:800}.status{color:#aaa;font-size:14px;font-weight:800;white-space:nowrap}
.small-btn{border:0;border-radius:11px;background:#0a84ff;color:#fff;min-height:44px;padding:0 12px;font-size:15px;font-weight:850}
.done{border-color:#30d158}.done .status{color:#30d158}
#cameraScreen{background:#000}.camera-wrap{max-width:760px;margin:auto;padding:8px}
.camera-title{text-align:center;font-size:24px;font-weight:900;padding:8px 0 10px}
.camera-box{position:relative;overflow:hidden;border-radius:16px;background:#111}
video{display:block;width:100%;height:min(68vh,650px);min-height:420px;object-fit:cover;background:#000}
/* File No.12: 機種読み取り枠を大幅拡大 */
.scan-frame{position:absolute;left:2%;right:2%;top:12%;height:76%;border:4px solid #0a84ff;border-radius:16px;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
.scan-frame.code{left:4%;right:4%;top:10%;height:80%}
.guide{position:absolute;top:18px;left:12px;right:12px;text-align:center;font-weight:900;text-shadow:0 1px 5px #000}
.complete{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:rgba(0,0,0,.70);padding:24px}
.complete.show{display:flex}.complete-mark{font-size:64px}.complete-title{font-size:40px;font-weight:900}
.complete-value{margin-top:10px;font-size:44px;font-weight:900;color:#30d158;letter-spacing:2px;word-break:break-all}
.camera-status{margin-top:10px;padding:10px 14px;border-radius:13px;background:#18181b}
#cameraStatus{font-size:18px;font-weight:850}#candidate{margin-top:5px;font-size:22px;font-weight:900;word-break:break-all}
.error{color:#ff453a}.help{margin-top:6px;color:#aaa;font-size:13px;line-height:1.4}canvas{display:none}
</style>
</head>
<body>
<div class="file-no">File No.12</div>

<section id="startScreen" class="screen">
<div class="start-box">
<div class="start-title">切替確認</div>
<div class="start-sub">文字またはバーコードから機種を確認します</div>
<button id="startModelCamera" class="main-btn">📷 機種確認カメラ</button>
</div>
</section>

<section id="cameraScreen" class="screen hidden">
<div class="camera-wrap">
<div id="cameraTitle" class="camera-title">機種読み込み</div>
<div class="camera-box">
<video id="video" autoplay playsinline muted></video>
<div id="scanFrame" class="scan-frame"></div>
<div id="guide" class="guide">青枠にラベル全体（バーコード＋機種文字）を入れてください</div>
<div id="completeOverlay" class="complete">
<div class="complete-mark">✅</div><div class="complete-title">読み込みOK</div>
<div id="completeValue" class="complete-value"></div>
</div>
</div>
<div class="camera-status">
<div id="cameraStatus">待機中</div><div id="candidate">-</div><div id="helpText" class="help"></div>
</div>
<button id="retryCamera" class="retry-btn hidden">カメラを再起動</button>
<button id="cancelCamera" class="cancel-btn">戻る</button>
</div>
</section>

<section id="inspectionScreen" class="screen hidden">
<div class="wrap">
<h1>切替確認</h1>
<div class="card"><div class="label">読み込み機種</div><div id="modelValue" class="model">---</div></div>
<button id="rescanModel" class="main-btn">📷 機種を読み直す</button>
<div class="inspect-title">点検</div>
<div class="item"><div class="num">1</div><div class="name">Fドレン</div><div class="status">未点検</div></div>
<div class="item"><div class="num">2</div><div class="name">Rドレン</div><div class="status">未点検</div></div>
<div class="item"><div class="num">3</div><div class="name">Sパイプ</div><div class="status">未点検</div></div>
<div class="item"><div class="num">4</div><div class="name">HGパイプ（T6/T7）</div><div class="status">未点検</div></div>
<div class="item"><div class="num">5</div><div class="name">ガス抜きシート</div><div class="status">未点検</div></div>
<div class="item"><div class="num">6</div><div class="name">CPケース</div><div class="status">未点検</div></div>
<div class="item"><div class="num">7</div><div class="name">シキリ板確認</div><div class="status">未点検</div></div>
<div class="item"><div class="num">8</div><div class="name">シキリマーキング</div><div class="status">未点検</div></div>
<div id="codeItem" class="item"><div class="num">9</div><div class="name">コード確認</div>
<button id="scanCode" class="small-btn">📷 QR確認</button><div id="codeStatus" class="status">未確認</div></div>
</div>
</section>
<canvas id="canvas"></canvas>

<script>
const MODEL_KEY="kirikae_model_confirmed_v12";
const CODE_KEY="kirikae_code_confirmed_v12";
const MODEL_PATTERN=/[A-Z][0-9]{3}[A-Z]{1,3}/g;
const $=id=>document.getElementById(id);
const startScreen=$("startScreen"),cameraScreen=$("cameraScreen"),inspectionScreen=$("inspectionScreen");
const video=$("video"),canvas=$("canvas"),scanFrame=$("scanFrame"),guide=$("guide"),cameraTitle=$("cameraTitle");
const cameraStatus=$("cameraStatus"),candidate=$("candidate"),helpText=$("helpText"),completeOverlay=$("completeOverlay"),completeValue=$("completeValue");
const retryCamera=$("retryCamera"),modelValue=$("modelValue"),codeItem=$("codeItem"),codeStatus=$("codeStatus");
let currentMode="model",stream=null,scanning=false,busy=false,cameraStarting=false,barcodeDetector=null,ocrWorker=null,ocrReadyPromise=null,scanTimer=null;
let lastCandidate="",lastCandidateAt=0;

function readJSON(key){try{const r=localStorage.getItem(key);return r?JSON.parse(r):null}catch(e){return null}}
function showOnly(s){[startScreen,cameraScreen,inspectionScreen].forEach(x=>x.classList.add("hidden"));s.classList.remove("hidden")}
function showInspection(){
 stopCamera();const m=readJSON(MODEL_KEY);if(!m||!m.value){showOnly(startScreen);return}
 modelValue.textContent=m.value;const c=readJSON(CODE_KEY);
 if(c&&c.value){codeStatus.textContent="✅ 完了";codeItem.classList.add("done")}else{codeStatus.textContent="未確認";codeItem.classList.remove("done")}
 showOnly(inspectionScreen)
}
(function(){readJSON(MODEL_KEY)?showInspection():showOnly(startScreen)})();
$("startModelCamera").onclick=()=>openCamera("model");$("rescanModel").onclick=()=>openCamera("model");$("scanCode").onclick=()=>openCamera("code");
retryCamera.onclick=()=>openCamera(currentMode);$("cancelCamera").onclick=()=>{stopCamera();readJSON(MODEL_KEY)?showInspection():showOnly(startScreen)};

async function openCamera(mode){
 if(cameraStarting)return;cameraStarting=true;stopCamera();currentMode=mode;lastCandidate="";lastCandidateAt=0;
 candidate.textContent="-";helpText.textContent="";retryCamera.classList.add("hidden");completeOverlay.classList.remove("show");
 if(mode==="code"){cameraTitle.textContent="コード確認";guide.textContent="QRコード全体を青枠内に入れてください";scanFrame.classList.add("code")}
 else{cameraTitle.textContent="機種読み込み";guide.textContent="青枠にラベル全体（バーコード＋機種文字）を入れてください";scanFrame.classList.remove("code")}
 showOnly(cameraScreen);cameraStatus.classList.remove("error");cameraStatus.textContent="カメラ起動中…";
 try{
  if(!window.isSecureContext)throw new Error("NOT_SECURE");
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
  video.srcObject=stream;await video.play();await prepareBarcode();if(mode==="model")prepareOCR().catch(()=>{});
  scanning=true;cameraStatus.textContent="🔍 高速読み取り中…";scanTimer=setTimeout(scanLoop,80);
 }catch(e){
  stopCamera();cameraStatus.classList.add("error");cameraStatus.textContent=e&&e.name==="NotAllowedError"?"カメラの使用が許可されていません":"カメラを起動できません";
  helpText.textContent="Safariのカメラ権限とHTTPSを確認してください。";retryCamera.classList.remove("hidden");
 }finally{cameraStarting=false}
}
function stopCamera(){scanning=false;busy=false;if(scanTimer){clearTimeout(scanTimer);scanTimer=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
function prepareOCR(){
 if(ocrReadyPromise)return ocrReadyPromise;
 return ocrReadyPromise=(async()=>{ocrWorker=await Tesseract.createWorker("eng");await ocrWorker.setParameters({
  tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",tessedit_pageseg_mode:"11",preserve_interword_spaces:"0"
 });return ocrWorker})()
}
async function prepareBarcode(){
 barcodeDetector=null;if(!("BarcodeDetector" in window))return;
 try{const s=await BarcodeDetector.getSupportedFormats();const p=currentMode==="code"?["qr_code","data_matrix","code_128","code_39","code_93"]:["code_128","code_39","code_93","qr_code","data_matrix"];
 const f=p.filter(x=>s.includes(x));barcodeDetector=new BarcodeDetector(f.length?{formats:f}:undefined)}catch(e){}
}
function normalizeText(t){return String(t).toUpperCase().replace(/\s+/g,"").replace(/[^A-Z0-9]/g,"")}
function extractModel(t){const m=normalizeText(t).match(MODEL_PATTERN);if(!m)return null;m.sort((a,b)=>b.length-a.length);return m[0]}

async function scanLoop(){
 if(!scanning||busy)return;if(video.readyState<2){scanTimer=setTimeout(scanLoop,80);return}busy=true;
 try{if(currentMode==="code")await readCode();else{const hit=await readModelBarcode();if(!hit&&scanning)await readModelOCR()}}catch(e){}
 finally{busy=false;if(scanning)scanTimer=setTimeout(scanLoop,currentMode==="code"?70:90)}
}
async function readCode(){
 const w=video.videoWidth,h=video.videoHeight;if(!w||!h)return;canvas.width=Math.min(w,1100);canvas.height=Math.round(h*(canvas.width/w));
 const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(video,0,0,w,h,0,0,canvas.width,canvas.height);
 if(typeof jsQR==="function"){const im=ctx.getImageData(0,0,canvas.width,canvas.height),q=jsQR(im.data,canvas.width,canvas.height,{inversionAttempts:"attemptBoth"});
 if(q&&q.data){detectFast(String(q.data).trim(),"QR");return}}
 if(barcodeDetector){try{const rs=await barcodeDetector.detect(video);if(rs[0]&&rs[0].rawValue){detectFast(String(rs[0].rawValue).trim(),"コード");return}}catch(e){}}
 cameraStatus.textContent="🔍 QRコードを読み取り中…"
}
async function readModelBarcode(){
 if(!barcodeDetector)return false;
 try{const rs=await barcodeDetector.detect(video);for(const r of rs){const m=extractModel(r.rawValue||"");if(m){candidate.textContent=m;detectFast(m,"バーコード");return true}}}catch(e){}
 return false
}
async function readModelOCR(){
 const w=video.videoWidth,h=video.videoHeight;if(!w||!h)return;
 /* 広い青枠と同等の領域をOCR。ラベル下部の文字も拾う */
 const x=w*.02,y=h*.12,cw=w*.96,ch=h*.76,scale=Math.min(1,1400/cw);
 canvas.width=Math.round(cw*scale);canvas.height=Math.round(ch*scale);
 const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(video,x,y,cw,ch,0,0,canvas.width,canvas.height);
 try{const worker=await prepareOCR();const result=await worker.recognize(canvas);const m=extractModel(result.data.text||"");
 if(m){candidate.textContent=m;detectFast(m,"文字OCR")}}catch(e){}
}
/* 最速化：有効な機種文字を1回確実に取得した時点で確定。
   直前候補が短時間に再検出された場合も即確定。 */
function detectFast(value,method){
 if(!value)return;const now=Date.now();candidate.textContent=value;
 if(currentMode==="model" && !MODEL_PATTERN.test(value)){MODEL_PATTERN.lastIndex=0;return}
 MODEL_PATTERN.lastIndex=0;
 if(value===lastCandidate && now-lastCandidateAt<1200){confirmRead(value,method);return}
 lastCandidate=value;lastCandidateAt=now;cameraStatus.textContent="✓ 読み取り確認";
 /* 正規表現に合う文字/有効コードなら待たず確定 */
 confirmRead(value,method)
}
function confirmRead(value,method){
 if(!scanning)return;scanning=false;if(scanTimer){clearTimeout(scanTimer);scanTimer=null}
 const now=new Date();localStorage.setItem(currentMode==="code"?CODE_KEY:MODEL_KEY,JSON.stringify({value,method,timeISO:now.toISOString(),timeText:now.toLocaleString("ja-JP")}));
 completeValue.textContent=value;completeOverlay.classList.add("show");cameraStatus.textContent="✅ 読み込み完了";if(navigator.vibrate)navigator.vibrate(80);
 setTimeout(showInspection,350)
}
</script>
</body>
</html>
